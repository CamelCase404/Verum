# Основной сайт
server {
    listen 80;
    server_name verumskills.ru www.verumskills.ru;
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Сайт собеседования
server {
    listen 80;
    server_name test.verumskills.ru;
    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Бэкенд API
server {
    listen 80;
    server_name api.verumskills.ru;
    client_max_body_size 100M; # Разрешаем загрузку видео
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
